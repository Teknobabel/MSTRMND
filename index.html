<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#070304" />
    <title>Mastermind</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070304'/%3E%3Ctext x='16' y='24' font-family='Arial Black,sans-serif' font-size='22' font-weight='900' fill='%23e8112d' text-anchor='middle'%3E%CE%A9%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app-root">
      <section id="screen-main" class="screen screen-main" aria-labelledby="main-title">
        <div class="menu-backdrop" aria-hidden="true"></div>
        <div class="menu-emblem" aria-hidden="true"><span>&Omega;</span></div>
        <h1 id="main-title" class="screen-title screen-title--menu">MASTERMIND</h1>
        <p class="menu-tagline">ALL WILL KNEEL.</p>
        <div class="screen-actions">
          <div class="menu-setup">
            <div class="menu-field">
              <label class="game-field-label" for="select-omega-plan">Omega Plan</label>
              <select class="game-select" id="select-omega-plan">
                <option value="random">Random</option>
              </select>
            </div>
            <div class="menu-field">
              <label class="game-field-label" for="select-lair">Lair</label>
              <select class="game-select" id="select-lair">
                <option value="random">Random</option>
              </select>
            </div>
          </div>
          <button type="button" class="btn btn-primary" id="btn-play">Initiate</button>
          <button type="button" class="btn" id="btn-main-settings">Settings</button>
        </div>
      </section>

      <section id="screen-settings" class="screen screen-settings" hidden aria-hidden="true">
        <div class="menu-backdrop" aria-hidden="true"></div>
        <h2 class="screen-title screen-title--menu">SETTINGS</h2>
        <div class="screen-actions">
          <button type="button" class="btn" id="btn-settings-back">Back</button>
        </div>
      </section>

      <section id="screen-game" class="screen screen-game" hidden aria-hidden="true">
        <canvas id="game-canvas" class="game-canvas" aria-label="Game canvas"></canvas>
        <div class="omega-shell">
          <header class="omega-topbar" aria-label="Omega OS header">
            <span class="omega-topbar__corner omega-topbar__corner--left">OMEGA OS v0.0.1</span>
            <div class="omega-topbar__emblem" aria-hidden="true">
              <span class="omega-topbar__emblem-mark">&Omega;</span>
            </div>
            <span class="omega-topbar__corner omega-topbar__corner--right">ALL WILL KNEEL.</span>
          </header>

          <div class="omega-statusbar" aria-label="Player status and turn">
            <div id="game-stats" class="game-stats" aria-live="polite"></div>
            <div class="omega-statusbar__right">
              <div id="threat-level" class="threat-meter" aria-label="Threat level"></div>
              <button
                type="button"
                class="btn btn-turn-corner game-ui-stats-turn"
                id="game-hud-short"
                aria-label="View turn activity log"
              >
                Turn 1
              </button>
              <button type="button" class="btn btn-pause-corner" id="btn-pause" aria-label="Pause">
                <svg class="btn-pause-corner__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" />
                  <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" />
                </svg>
              </button>
            </div>
          </div>

          <div class="omega-body">
            <aside class="omega-sidebar game-panel game-panel--plan-column" aria-label="Mission planning">
              <header class="game-player-profile" aria-label="Player and organization">
                <img
                  id="player-profile-pic"
                  class="game-player-profile__pic"
                  src=""
                  alt=""
                  width="48"
                  height="48"
                  decoding="async"
                />
                <div class="game-player-profile__text">
                  <p id="player-name" class="game-player-profile__name"></p>
                  <p id="organization-name" class="organization-name game-player-profile__org"></p>
                </div>
              </header>
              <nav class="game-panel-menu" aria-label="Game panel navigation">
                <button type="button" class="game-panel-menu__button" data-game-menu="dashboard" aria-pressed="true">
                  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 10.5 12 3l9 7.5" />
                    <path d="M5.5 9.5V21h13V9.5" />
                  </svg>
                  <span>Dashboard</span>
                </button>
                <button type="button" class="game-panel-menu__button" data-game-menu="omega" aria-pressed="false">
                  <span class="nav-icon nav-icon--text" aria-hidden="true">&Omega;</span>
                  <span>Omega Plan</span>
                </button>
                <button type="button" class="game-panel-menu__button" data-game-menu="missions" aria-pressed="false">
                  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="7.5" />
                    <circle cx="12" cy="12" r="2.5" />
                    <path d="M12 1.5v3.5m0 14v3.5M1.5 12H5m14 0h3.5" />
                  </svg>
                  <span>Missions</span>
                </button>
                <button type="button" class="game-panel-menu__button" data-game-menu="minions" aria-pressed="false">
                  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="7.5" r="4" />
                    <path d="M4.5 21v-1.5a6 6 0 0 1 6-6h3a6 6 0 0 1 6 6V21" />
                  </svg>
                  <span>Minions</span>
                </button>
                <button type="button" class="game-panel-menu__button" data-game-menu="locations" aria-pressed="false">
                  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 21s-7-5.7-7-11a7 7 0 0 1 14 0c0 5.3-7 11-7 11Z" />
                    <circle cx="12" cy="10" r="2.5" />
                  </svg>
                  <span>Locations</span>
                </button>
                <button type="button" class="game-panel-menu__button" data-game-menu="lair" aria-pressed="false">
                  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M4 21V9l8-6 8 6v12" />
                    <path d="M10 21v-6h4v6" />
                  </svg>
                  <span>Lair</span>
                </button>
                <button type="button" class="game-panel-menu__button game-panel-menu__button--system" id="btn-game-panel-system">
                  <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M12 2.5v3m0 13v3M2.5 12h3m13 0h3M5 5l2.1 2.1M16.9 16.9 19 19M19 5l-2.1 2.1M7.1 16.9 5 19" />
                  </svg>
                  <span>System</span>
                </button>
              </nav>
              <div class="plan-column-stack">
                <h2 id="plan-panel-title" class="game-panel-title">Mission Planning</h2>
                <div
                  id="plan-column-panel-plan"
                  class="missions-panel-page"
                  aria-labelledby="plan-panel-title"
                >
                  <div class="game-controls">
                    <div class="game-controls-section">
                      <label class="game-field">
                        <span class="game-field-label">Mission</span>
                        <div
                          id="assign-mission-slot"
                          class="assign-pick-slot"
                          data-assign-pick="mission"
                          aria-label="Mission slot, drag a mission card here"
                        ></div>
                      </label>
                      <label class="game-field" id="assign-target-field">
                        <span class="game-field-label" id="assign-target-label">Target</span>
                        <div
                          id="assign-target-slot"
                          class="assign-pick-slot"
                          data-assign-pick="target"
                          aria-label="Mission target slot"
                        ></div>
                      </label>
                      <div id="assign-minions" class="game-field">
                        <span class="game-field-label">Minions</span>
                        <div id="assign-minions-list"></div>
                      </div>
                      <div id="assign-asset-slots-fieldset" class="game-field" hidden>
                        <span class="game-field-label">Required Assets</span>
                        <div id="assign-asset-slots-list"></div>
                      </div>
                      <div id="assign-support-assets-fieldset" class="game-field" hidden>
                        <span class="game-field-label" id="assign-support-assets-label">Support Assets</span>
                        <div id="assign-support-assets-list"></div>
                      </div>
                    </div>
                  </div>
                </div>
                <div class="plan-column-footer">
                  <button type="button" class="btn btn-submit-mission" id="btn-assign-mission">
                    <span>Submit</span>
                    <span id="assign-submit-chance" class="btn-submit-mission__chance" hidden></span>
                  </button>
                </div>
              </div>
            </aside>

            <main class="omega-main game-ui-right-block">
              <div class="game-ui-columns-row">
                <aside
                  class="game-panel game-panel--map"
                  data-menu-panel="dashboard"
                  aria-label="Global map"
                >
                  <div id="map-panel" class="map-panel"></div>
                </aside>
                <aside class="game-panel game-panel--locations" data-menu-panel="locations" aria-labelledby="locations-panel-title">
                  <h2 id="locations-panel-title" class="game-panel-title">Locations</h2>
                  <div id="locations-panel" class="locations-panel"></div>
                </aside>
                <aside class="game-panel game-panel--omega" data-menu-panel="omega" aria-labelledby="omega-plan-panel-title">
                  <h2 id="omega-plan-panel-title" class="game-panel-title">Omega Plan</h2>
                  <div id="omega-plan-panel" class="omega-plan-panel"></div>
                </aside>
                <aside class="game-panel game-panel--minions" data-menu-panel="minions" aria-labelledby="minions-panel-title">
                  <h2 id="minions-panel-title" class="game-panel-title">Minions</h2>
                  <div id="minions-panel" class="minions-panel"></div>
                </aside>
                <aside
                  class="game-panel game-panel--lair"
                  data-menu-panel="lair"
                  aria-labelledby="lair-panel-title"
                >
                  <h2 id="lair-panel-title" class="game-panel-title">Lair</h2>
                  <div id="lair-panel" class="lair-panel"></div>
                </aside>
                <!-- Missions has no dashboard tile: the Lair panel carries an Active Missions
                     tab. This panel is only the fullscreen Missions menu. -->
                <aside
                  class="game-panel game-panel--missions"
                  data-menu-panel="missions"
                  data-dashboard-hidden="true"
                  aria-labelledby="missions-panel-title"
                >
                  <h2 id="missions-panel-title" class="game-panel-title">Active Missions</h2>
                  <div id="missions-panel-root" class="missions-panel-root"></div>
                </aside>
              </div>
            </main>
          </div>

          <footer class="omega-ticker-bar game-hud" aria-label="Global events and plan actions">
            <div class="omega-ticker__label">
              <span class="omega-ticker__signal" aria-hidden="true"></span>
              Global Events
            </div>
            <div class="omega-ticker" aria-live="off">
              <div id="global-events-ticker" class="omega-ticker__track"></div>
            </div>
            <button type="button" class="btn btn-primary btn-execute" id="btn-execute-plan">
              Execute <span class="btn-execute__chev" aria-hidden="true">&#9656;</span>
            </button>
          </footer>
        </div>

        <div id="overlay-turn-report" class="turn-report-overlay" hidden aria-hidden="true">
          <div class="turn-report-backdrop" aria-hidden="true"></div>
          <div
            class="turn-report-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="turn-report-title"
            aria-describedby="turn-report-body"
          >
            <header class="turn-report-head">
              <div class="turn-report-head__text">
                <p id="turn-report-kicker" class="turn-report-kicker"></p>
                <h2 id="turn-report-title" class="turn-report-title"></h2>
              </div>
              <div id="turn-report-verdict" class="turn-report-verdict"></div>
            </header>
            <div id="turn-report-steps" class="turn-report-steps" aria-hidden="true"></div>
            <div id="turn-report-body" class="turn-report-body" tabindex="-1"></div>
            <footer class="turn-report-actions">
              <button type="button" class="btn btn-turn-report-skip" id="btn-turn-report-skip">
                Skip all
              </button>
              <button type="button" class="btn btn-primary" id="btn-turn-report-continue">
                Continue
              </button>
            </footer>
          </div>
        </div>

        <div id="overlay-activity-log" class="turn-report-overlay" hidden aria-hidden="true">
          <div class="turn-report-backdrop" id="activity-log-backdrop" aria-hidden="true"></div>
          <div
            class="turn-report-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="activity-log-title"
            aria-describedby="activity-log-body"
          >
            <header class="turn-report-head">
              <div class="turn-report-head__text">
                <p id="activity-log-kicker" class="turn-report-kicker">Operations Log</p>
                <h2 id="activity-log-title" class="turn-report-title">Turn Activity Log</h2>
              </div>
              <div id="activity-log-verdict" class="turn-report-verdict turn-report-verdict--tally">Turn 1</div>
            </header>
            <div id="activity-log-body" class="turn-report-body" tabindex="-1"></div>
            <footer class="turn-report-actions">
              <button type="button" class="btn btn-primary" id="btn-activity-log-close">
                Close
              </button>
            </footer>
          </div>
        </div>

        <div
          id="overlay-run-end"
          class="turn-report-overlay run-end-overlay"
          hidden
          aria-hidden="true"
        >
          <div class="turn-report-backdrop run-end-backdrop" aria-hidden="true"></div>
          <div
            class="turn-report-panel run-end-panel"
            role="dialog"
            aria-modal="true"
            aria-labelledby="run-end-title"
            aria-describedby="run-end-body"
          >
            <header class="turn-report-head">
              <div class="turn-report-head__text">
                <p id="run-end-kicker" class="turn-report-kicker"></p>
                <h2 id="run-end-title" class="turn-report-title"></h2>
              </div>
              <div id="run-end-verdict" class="turn-report-verdict"></div>
            </header>
            <div id="run-end-steps" class="turn-report-steps" aria-hidden="true"></div>
            <div id="run-end-body" class="turn-report-body" tabindex="-1"></div>
            <footer class="turn-report-actions">
              <button type="button" class="btn btn-primary" id="btn-run-end-continue">
                Continue
              </button>
            </footer>
          </div>
        </div>

        <div id="overlay-pause" class="pause-overlay" hidden aria-hidden="true">
          <div class="pause-backdrop" aria-hidden="true"></div>
          <div class="pause-panel" role="dialog" aria-modal="true" aria-labelledby="pause-heading">
            <h2 id="pause-heading" class="pause-title">OPERATIONS SUSPENDED</h2>
            <div class="screen-actions pause-actions">
              <button type="button" class="btn" id="btn-pause-back">Resume</button>
              <button type="button" class="btn" id="btn-pause-quit">Quit</button>
              <button type="button" class="btn" id="btn-pause-settings">Settings</button>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
